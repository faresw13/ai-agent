<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fares AI Store Agent</title>

    <script src="https://unpkg.com/@salla.sa/embedded-sdk/dist/umd/index.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8f8f8;
            color: #222;
        }

        .container {
            padding: 40px;
        }

        .card {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 16px;
            padding: 40px;
        }

        h1 {
            margin: 0 0 10px;
        }

        p {
            color: #666;
        }

        #status {
            margin-top: 25px;
            padding: 15px;
            border-radius: 10px;
            background: #e8fff5;
            color: #008f63;
        }

        #error {
            margin-top: 25px;
            padding: 15px;
            border-radius: 10px;
            background: #fff0f0;
            color: #c62828;
            display: none;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Fares AI Store Agent</h1>

            <p>
                وكيل ذكاء اصطناعي لتصميم وتجهيز متاجر سلة
            </p>

            <div id="status">
                جاري الاتصال بسلة...
            </div>

            <div id="error"></div>

        </div>

    </div>

    <script>

        async function start() {

            const status = document.getElementById("status");
            const error = document.getElementById("error");

            try {

                if (!window.Salla) {
                    throw new Error(
                        "Salla SDK لم يتم تحميله"
                    );
                }

                if (!window.Salla.embedded) {
                    throw new Error(
                        "Salla Embedded SDK غير متوفر"
                    );
                }

                const embedded = window.Salla.embedded;

                status.textContent =
                    "جاري تهيئة الاتصال...";

                await embedded.init({
                    debug: true
                });

                console.log(
                    "Salla Embedded SDK initialized"
                );

                const token =
                    embedded.auth.getToken();

                console.log(
                    "Token:",
                    token ? "Received" : "Missing"
                );

                /*
                 * للاختبار:
                 * نخبر سلة أن التطبيق أصبح جاهزًا
                 */

                embedded.ready();

                console.log(
                    "Salla app is ready"
                );

                status.textContent =
                    "تم الاتصال بسلة بنجاح ✓";

                if (
                    embedded.page &&
                    embedded.page.setTitle
                ) {
                    embedded.page.setTitle(
                        "Fares AI Store Agent"
                    );
                }

            } catch (err) {

                console.error(
                    "Embedded SDK Error:",
                    err
                );

                status.style.display =
                    "none";

                error.style.display =
                    "block";

                error.textContent =
                    "خطأ في الاتصال مع سلة:\n\n" +
                    (err.message || err);
            }

        }

        start();

    </script>

</body>

</html>
